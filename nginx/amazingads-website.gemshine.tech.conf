# ==============================================================================
# Nginx Configuration for: amazingads-website.gemshine.tech
# Reverse Proxy to Port 5029 (PM2 Node.js Backend) + Static React Frontend
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name amazingads-website.gemshine.tech;

    # Maximum file upload size for 50MB product images & calendar mockups
    client_max_body_size 50M;

    # Web Root for Production React Frontend Build (dist folder)
    # Update this path to match your deployment directory on the VPS
    root /var/www/amazingads-website/dist;
    index index.html;

    # Gzip Compression for high-speed page loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy -> Express Backend Server running on Port 5029
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5029;
        proxy_http_version 1.1;
        
        # WebSockets & Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real Client IP forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large calendar uploads
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # --------------------------------------------------------------------------
    # 2. Static Asset Caching (JS, CSS, SVGs, Fonts)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. React Frontend SPA Routing Fallback
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
